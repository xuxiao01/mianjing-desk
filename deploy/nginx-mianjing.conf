# Include inside the existing xuxiaoapi.online server block only.
location = /mianjing {
    return 301 /mianjing/$is_args$args;
}

location ^~ /mianjing/assets/ {
    root /www/wwwroot/mianjing-desk/shared;
    try_files $uri =404;
    expires 365d;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location = /mianjing/index.html {
    root /www/wwwroot/mianjing-desk/current;
    try_files $uri =503;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location ^~ /mianjing/ {
    root /www/wwwroot/mianjing-desk/current;
    try_files $uri $uri/ /mianjing/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
